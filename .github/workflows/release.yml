# A v* tag builds Greenroom, signs it with the Developer ID identity, has Apple notarize it and attaches the disk
# image to a draft release. docs/RELEASING.md lists the secrets.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Engine cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/engine-cache
          key: engine-${{ hashFiles('engine.lock') }}
      - name: Signing identity
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ -n "$P12" ]] || { echo "::error::the DEVELOPER_ID_P12 secret is not set (docs/RELEASING.md)"; exit 1; }
          [[ -n "$SPARKLE_KEY" ]] || { echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is not set (docs/RELEASING.md)"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; PASS=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/id.p12"
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')
          [[ -n "$ID" ]] || { echo "::error::no Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          echo "IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Build and sign
        run: scripts/bundle.sh --identity "$IDENTITY" --version "${GITHUB_REF_NAME#v}" --check
      - name: Notarize and build the disk image
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [[ -n "$NOTARY_KEY_P8" ]] || { echo "::error::the NOTARY_KEY_P8 secret is not set (docs/RELEASING.md)"; exit 1; }
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY"
          scripts/dmg.sh --identity "$IDENTITY" --notarize
          rm -f "$NOTARY_KEY"
      - name: Appcast (in-app updates)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is not set (docs/RELEASING.md)"; exit 1; }
          mkdir -p build/feed && cp build/Greenroom-*.dmg build/feed/
          echo "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/aglose/greenroom/releases/download/$GITHUB_REF_NAME/" build/feed
          cp build/feed/appcast.xml build/appcast.xml
          grep -q 'sparkle:edSignature=' build/appcast.xml
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Greenroom ${GITHUB_REF_NAME#v}" --generate-notes \
            build/Greenroom-*.dmg build/Greenroom-*.dmg.sha256 build/appcast.xml
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
