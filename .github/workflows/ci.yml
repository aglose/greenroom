name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Engine cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/engine-cache
          key: engine-${{ hashFiles('engine.lock') }}
      - name: Build, sign ad hoc, run the bundled test app
        run: scripts/bundle.sh --check
      - name: Disk image
        run: scripts/dmg.sh
      - name: No connections of our own (PRIVACY.md)
        run: scripts/network-check.sh
